# Copie du site pour le bac à sable. Les contenus (pages, news, ateliers) sont
# lus sur le vrai WordPress ; les envois (adhésion, contact) passent par
# /bac-a-sable-graphql, relayé vers le WordPress de test.
server {
    listen 80;
    root /srv/current;
    index index.html;

    location = /bac-a-sable-graphql {
        proxy_pass http://wp/index.php?graphql;
        proxy_set_header Host $host:8504;
        proxy_set_header X-Forwarded-Host $host:8504;
        proxy_set_header X-Forwarded-For $remote_addr;
        client_max_body_size 12m;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
