# Pré-production du circuit d'adhésion, sur la Raspberry Pi : comme en vrai
# (Discord, e-mails, paiements de test HelloAsso et PayPal), mais avec un
# serveur Discord et des adresses de test.
#
# Les conteneurs n'écoutent que sur la Pi elle-même (127.0.0.1) : on les
# atteint uniquement par Tailscale (voir README, « Pré-production »).
#   https://<nom tailscale de la pi>        copie du site       (Tailscale)
#   https://<nom tailscale de la pi>:8443   WordPress            (Tailscale)
#   https://<nom tailscale de la pi>:10000  Discord et HelloAsso (public, deux adresses)
#
# Les réglages propres à la Pi (nom, compte d'envoi des e-mails, adresses
# autorisées) sont dans .env, à côté de ce fichier, jamais dans Git.
services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
      MARIADB_DATABASE: wp
      MARIADB_USER: wp
      MARIADB_PASSWORD: preprod
    volumes:
      - db:/var/lib/mysql

  wp:
    image: wordpress:php8.2-apache
    restart: unless-stopped
    depends_on: [db]
    ports:
      - "127.0.0.1:8506:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: preprod
      WORDPRESS_DB_NAME: wp
      PREPROD_HOTE: ${PREPROD_HOTE:?à renseigner dans .env}
      SMTP_UTILISATEUR: ${SMTP_UTILISATEUR:-}
      SMTP_MOT_DE_PASSE: ${SMTP_MOT_DE_PASSE:-}
      SMTP_SERVEUR: ${SMTP_SERVEUR:-smtp.gmail.com}
      DESTINATAIRES_AUTORISES: ${DESTINATAIRES_AUTORISES:-}
      # Derrière « tailscale serve », WordPress est servi en HTTPS : il doit
      # le savoir pour ses adresses et ses cookies.
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', 'https://' . getenv('PREPROD_HOTE') . ':8443');
        define('WP_SITEURL', 'https://' . getenv('PREPROD_HOTE') . ':8443');
        $$_SERVER['HTTPS'] = 'on';
    volumes:
      - wp:/var/www/html
      - ./plugin:/var/www/html/wp-content/plugins/nyassobi-wp-plugin:ro
      - ./mu:/var/www/html/wp-content/mu-plugins:ro

  cli:
    image: wordpress:cli-php8.2
    depends_on: [wp]
    user: "33:33"
    environment:
      WP_CLI_CACHE_DIR: /tmp/wp-cli-cache
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: preprod
      WORDPRESS_DB_NAME: wp
      PREPROD_HOTE: ${PREPROD_HOTE:?à renseigner dans .env}
    volumes:
      - wp:/var/www/html
      - ./plugin:/var/www/html/wp-content/plugins/nyassobi-wp-plugin:ro
      - ./mu:/var/www/html/wp-content/mu-plugins:ro
    entrypoint: ["sleep", "infinity"]

  site:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [wp]
    ports:
      - "127.0.0.1:8507:80"
    volumes:
      - ./www:/srv:ro
      - ./site-nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  db: {}
  wp: {}
