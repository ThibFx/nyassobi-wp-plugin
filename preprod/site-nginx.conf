# Copie du site pour la pré-production. Les contenus (pages, news, ateliers)
# sont lus sur le vrai WordPress ; les envois (adhésion, contact) passent par
# /preprod-graphql, relayé vers le WordPress de pré-production.
server {
    listen 80;

    # Comme la version de travail : le script principal passe de 390 à 120 Ko,
    # ce qui compte sur une connexion lente (partage de connexion du téléphone).
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    root /srv/current;
    index index.html;

    location = /preprod-graphql {
        proxy_pass http://wp/index.php?graphql;
        proxy_set_header X-Forwarded-For $remote_addr;
        client_max_body_size 12m;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
